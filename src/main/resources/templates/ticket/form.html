<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${ticket.id != null} ? 'Editar Ticket' : 'Novo Ticket'">Ticket</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav>
        <a th:href="@{/}" class="brand">Helpdesk</a>
        <a th:href="@{/tickets}">Tickets</a>
        <a th:href="@{/atendentes}">Atendentes</a>
    </nav>

    <div class="container">
        <div class="toolbar">
            <h1 th:text="${ticket.id != null} ? 'Editar Ticket' : 'Novo Ticket'">Ticket</h1>
            <a th:href="@{/tickets}" class="btn btn-secondary">Voltar</a>
        </div>

        <div class="form-card">
            <form th:action="@{/tickets/salvar}" th:object="${ticket}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label for="titulo">Titulo</label>
                    <input type="text" id="titulo" th:field="*{titulo}" placeholder="Titulo do chamado" required>
                </div>

                <div class="form-group">
                    <label for="descricao">Descricao</label>
                    <textarea id="descricao" th:field="*{descricao}" placeholder="Descreva o problema..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <input type="text" id="status" th:field="*{status}" placeholder="Ex: Aberto, Em andamento, Fechado">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a th:href="@{/tickets}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
